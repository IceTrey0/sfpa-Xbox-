name: Decompile spike

on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download and unpack game
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download game-files --pattern "*.zip" --dir game
          7z x game\*.zip -ogame\x "-xr!SFPA.app" -y | Out-Null

      - name: Get JPEXS decompiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo jindrapetrik/jpexs-decompiler --pattern "ffdec_*.zip" --dir ffdec
          $zip = Get-ChildItem ffdec -Filter *.zip | Where-Object { $_.Name -match '^ffdec_[\d\.]+\.zip$' } | Select-Object -First 1
          if (-not $zip) { Get-ChildItem ffdec; throw "ffdec zip not found" }
          Expand-Archive $zip.FullName -DestinationPath ffdec\app
          Get-ChildItem ffdec\app | Select-Object -First 20 | ForEach-Object { $_.Name }

      - name: Decompile SFPA.swf
        shell: pwsh
        run: |
          $jar = Get-ChildItem ffdec\app -Recurse -Filter ffdec.jar | Select-Object -First 1
          $swf = "game\x\Super Fancy Pants Adventure\SFPA.swf"
          java -Xmx8g -jar $jar.FullName -export script decomp $swf
          $count = (Get-ChildItem decomp -Recurse -Filter *.as -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "Exported $count .as files"
          if ($count -eq 0) { throw "No scripts exported" }

      - name: Summarize
        shell: pwsh
        run: |
          $root = (Resolve-Path decomp).Path
          $files = Get-ChildItem $root -Recurse -Filter *.as
          $total = 0
          $rows = foreach ($f in $files) {
            $n = [System.IO.File]::ReadAllLines($f.FullName).Length
            $total += $n
            [pscustomobject]@{ Path = $f.FullName.Substring($root.Length + 1); Lines = $n }
          }
          $s = @()
          $s += "# Decompile summary"
          $s += "Files: $($files.Count)   Total lines: $total"
          $s += ""
          $s += "## Lines by top-level package"
          $rows | Group-Object { ($_.Path -split '\\')[0] } |
            ForEach-Object { [pscustomobject]@{ Pkg = $_.Name; Files = $_.Count; Lines = ($_.Group | Measure-Object Lines -Sum).Sum } } |
            Sort-Object Lines -Descending | Select-Object -First 25 |
            ForEach-Object { $s += "- $($_.Pkg): $($_.Files) files, $($_.Lines) lines" }
          $s += ""
          $s += "## 25 largest files"
          $rows | Sort-Object Lines -Descending | Select-Object -First 25 |
            ForEach-Object { $s += "- $($_.Path): $($_.Lines)" }
          $s += ""
          $s += "## Platform touchpoints (files that mention each)"
          $pats = @('com.amanitadesign.steam','flash.filesystem','flash.desktop','NativeApplication','flash.display3D','starling.','flash.net.URLLoader','flash.system.Capabilities','SharedObject','flash.media')
          foreach ($p in $pats) {
            $hits = $files | Select-String -Pattern ([regex]::Escape($p)) -List
            $s += "- ${p}: $(($hits | Measure-Object).Count) files"
          }
          $s | Set-Content summary.md
          $s | ForEach-Object { Write-Host $_ }
          Get-Content summary.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: decompile-summary
          path: summary.md
          retention-days: 3
