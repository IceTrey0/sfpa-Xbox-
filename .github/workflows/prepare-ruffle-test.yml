
name: Prepare SFPA Ruffle test

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download and unpack the game release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force game, game\x, site, site\ruffle, ruffle-unpacked, out | Out-Null
          gh release download game-files --pattern "*.zip" --dir game --repo $env:GITHUB_REPOSITORY
          $archive = Get-ChildItem game -File -Filter "*.zip" | Select-Object -First 1
          if (-not $archive) { throw "No ZIP asset was found on the game-files release." }
          7z x $archive.FullName "-ogame\x" -y | Out-Null
          $swf = Get-ChildItem game\x -Recurse -File -Filter SFPA.swf | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $swf) { throw "SFPA.swf was not found in the downloaded game archive." }
          Copy-Item $swf.FullName site\SFPA.swf -Force
          Write-Host "Found SFPA.swf ($([math]::Round($swf.Length / 1MB, 1)) MB)."

      - name: Download the official Ruffle web package
        shell: pwsh
        run: |
          $url = "https://github.com/ruffle-rs/ruffle/releases/download/v0.7.1/ruffle-0.7.1-web-selfhosted.zip"
          Invoke-WebRequest -Uri $url -OutFile ruffle-web.zip
          Expand-Archive -Path ruffle-web.zip -DestinationPath ruffle-unpacked -Force

          $entry = Get-ChildItem ruffle-unpacked -Recurse -File -Filter ruffle.js | Select-Object -First 1
          if (-not $entry) { throw "The Ruffle package did not contain ruffle.js." }

          Copy-Item (Join-Path $entry.Directory.FullName "*") site\ruffle -Recurse -Force

          $wasm = Get-ChildItem site\ruffle -Recurse -File -Filter "*.wasm" | Select-Object -First 1
          if (-not $wasm) { throw "The Ruffle package did not contain a WASM file." }

          Write-Host "Ruffle WASM found: $($wasm.Name)"

      - name: Assemble the browser test site
        shell: pwsh
        run: |
          $html = @'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Super Fancy Pants Adventure</title>
            <style>
              html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #111;
              }
              embed {
                width: 100%;
                height: 100%;
              }
            </style>
            <script>
              window.RufflePlayer = window.RufflePlayer || {};
              window.RufflePlayer.config = {
                autoplay: "on",
                unmuteOverlay: "hidden"
              };
            </script>
            <script src="ruffle/ruffle.js"></script>
          </head>
          <body>
            <embed src="SFPA.swf" width="100%" height="100%">
          </body>
          </html>
          '@

          Set-Content -Path site\index.html -Value $html -Encoding UTF8

          if (-not (Test-Path site\index.html)) {
            throw "Could not create the browser test page."
          }

          Compress-Archive -Path site\* -DestinationPath out\sfpa-ruffle-test.zip -Force
          Write-Host "Browser test bundle created successfully."

      - uses: actions/upload-artifact@v4
        with:
          name: sfpa-ruffle-test
          path: out/sfpa-ruffle-test.zip
          if-no-files-found: error
          retention-days: 7
