
name: Deploy SFPA Ruffle Test

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download game archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p game site/ruffle

          gh release download game-files \
            --pattern "*.zip" \
            --dir game \
            --repo "$GITHUB_REPOSITORY"

          ARCHIVE=$(find game -name "*.zip" -type f | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "Game archive not found"
            exit 1
          fi

          unzip -q "$ARCHIVE" -d game/unpacked

          SWF=$(find game/unpacked -type f -iname "SFPA.swf" \
            -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -z "$SWF" ]; then
            echo "SFPA.swf not found"
            exit 1
          fi

          cp "$SWF" site/SFPA.swf

      - name: Download Ruffle
        run: |
          curl -L \
            "https://github.com/ruffle-rs/ruffle/releases/download/v0.7.1/ruffle-0.7.1-web-selfhosted.zip" \
            -o ruffle.zip

          mkdir ruffle-unpacked
          unzip -q ruffle.zip -d ruffle-unpacked

          ENTRY=$(find ruffle-unpacked -name ruffle.js -type f | head -n 1)

          if [ -z "$ENTRY" ]; then
            echo "ruffle.js not found"
            exit 1
          fi

          cp -a "$(dirname "$ENTRY")/." site/ruffle/

          WASM=$(find site/ruffle -name "*.wasm" -type f | head -n 1)

          if [ -z "$WASM" ]; then
            echo "Ruffle WASM not found"
            exit 1
          fi

      - name: Create game webpage
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Super Fancy Pants Adventure</title>
            <style>
              html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #111;
                color: white;
                font-family: Arial, sans-serif;
              }

              #status {
                position: fixed;
                z-index: 10;
                top: 0;
                left: 0;
                right: 0;
                padding: 12px;
                background: #222;
                color: #fff;
                font-size: 16px;
                white-space: pre-wrap;
              }

              ruffle-player {
                display: block;
                width: 100%;
                height: 100%;
              }
            </style>

            <script>
              window.RufflePlayer = window.RufflePlayer || {};
              window.RufflePlayer.config = {
                autoplay: "on",
                unmuteOverlay: "hidden"
              };
            </script>

            <script src="ruffle/ruffle.js"></script>
          </head>

          <body>
            <div id="status">Page loaded. Checking Ruffle...</div>

            <script>
              const statusBox = document.getElementById("status");

              function showStatus(message) {
                statusBox.textContent = message;
              }

              window.addEventListener("error", function(event) {
                showStatus(
                  "JavaScript error:\n" +
                  (event.message || "Unknown error") +
                  "\nFile: " + (event.filename || "unknown") +
                  "\nLine: " + (event.lineno || "unknown")
                );
              });

              window.addEventListener("unhandledrejection", function(event) {
                showStatus(
                  "Loading error:\n" +
                  String(event.reason || "Unknown rejection")
                );
              });

              window.addEventListener("load", async function() {
                try {
                  showStatus("Checking Ruffle...");

                  if (!window.RufflePlayer) {
                    throw new Error("Ruffle script did not load.");
                  }

                  const ruffle = window.RufflePlayer.newest();

                  if (!ruffle) {
                    throw new Error("Ruffle player is unavailable.");
                  }

                  showStatus("Creating game player...");

                  const player = ruffle.createPlayer();

                  player.style.width = "100%";
                  player.style.height = "100%";

                  document.body.appendChild(player);

                  showStatus("Loading Super Fancy Pants Adventure...");

                  await player.ruffle().load("SFPA.swf");

                  showStatus("Game loaded. Starting...");
                  
                  setTimeout(function() {
                    statusBox.style.display = "none";
                  }, 3000);

                } catch (error) {
                  showStatus(
                    "GAME FAILED TO LOAD\n\n" +
                    (error.stack || error.message || String(error))
                  );
                }
              });
            </script>
          </body>
          </html>
          EOF

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
