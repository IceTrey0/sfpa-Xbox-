
      - name: Create game webpage
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SFPA Ruffle Canvas Test</title>

            <style>
              html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #111;
                color: white;
                font-family: Arial, sans-serif;
              }

              ruffle-player {
                display: block;
                width: 100%;
                height: 100%;
              }

              #diagnostics {
                position: fixed;
                z-index: 100;
                top: 0;
                left: 0;
                right: 0;
                max-height: 45%;
                overflow: auto;
                padding: 12px;
                background: rgba(0, 0, 0, 0.92);
                color: #fff;
                font-size: 13px;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                border-bottom: 2px solid #777;
              }

              #diagnostics button {
                padding: 8px 14px;
                margin-bottom: 8px;
              }

              #log {
                margin: 0;
                white-space: pre-wrap;
              }
            </style>

            <script>
              window.RufflePlayer = window.RufflePlayer || {};

              window.RufflePlayer.config = {
                autoplay: "on",
                unmuteOverlay: "hidden",
                logLevel: "trace",
                playerRuntime: "air",
                preferredRenderer: "canvas"
              };
            </script>

            <script src="ruffle/ruffle.js"></script>
          </head>

          <body>
            <div id="diagnostics">
              <button onclick="this.parentElement.style.display='none'">
                Hide diagnostics
              </button>

              <pre id="log">Page loaded. Waiting for Ruffle...</pre>
            </div>

            <script>
              const logBox = document.getElementById("log");

              function report(message) {
                logBox.textContent += "\n" + String(message);
              }

              const originalError = console.error.bind(console);
              const originalWarn = console.warn.bind(console);

              console.error = function(...args) {
                report(
                  "[ERROR] " + args.map(String).join(" ")
                );

                originalError(...args);
              };

              console.warn = function(...args) {
                report(
                  "[WARNING] " + args.map(String).join(" ")
                );

                originalWarn(...args);
              };

              window.addEventListener("error", function(event) {
                report(
                  "[PAGE ERROR] " +
                  (event.message || "Unknown error") +
                  " at " +
                  (event.filename || "unknown file") +
                  ":" +
                  (event.lineno || "?")
                );
              });

              window.addEventListener("unhandledrejection", function(event) {
                report(
                  "[PROMISE ERROR] " +
                  String(event.reason)
                );
              });

              window.addEventListener("load", async function() {
                try {
                  report("Checking Ruffle...");

                  if (!window.RufflePlayer) {
                    throw new Error("Ruffle script did not load.");
                  }

                  const ruffle = window.RufflePlayer.newest();

                  if (!ruffle) {
                    throw new Error("Ruffle player is unavailable.");
                  }

                  report("Creating AIR + Canvas player...");

                  const player = ruffle.createPlayer();

                  player.style.width = "100%";
                  player.style.height = "100%";

                  document.body.appendChild(player);

                  player.addEventListener("loadedmetadata", function() {
                    report("SWF metadata loaded.");

                    try {
                      const metadata = player.ruffle().metadata;

                      report(
                        "ActionScript 3: " +
                        metadata.isActionScript3
                      );

                      report(
                        "SWF frame rate: " +
                        metadata.frameRate
                      );

                      report(
                        "SWF dimensions: " +
                        metadata.width +
                        " x " +
                        metadata.height
                      );

                    } catch (error) {
                      report("Metadata read error: " + error);
                    }
                  });

                  player.addEventListener("loadeddata", function() {
                    report("SWF fully loaded.");
                  });

                  report("Runtime: Adobe AIR");
                  report("Renderer requested: Canvas");
                  report("Log level: Trace");
                  report("Loading SFPA.swf...");

                  await player.ruffle().load("SFPA.swf");

                  report("Ruffle load promise completed.");

                  report(
                    "Player readyState: " +
                    player.readyState
                  );

                  report("AIR + Canvas test is running.");
                  report("Diagnostic panel will remain visible.");

                } catch (error) {
                  report(
                    "[STARTUP FAILURE] " +
                    (error.stack || error.message || String(error))
                  );
                }
              });
            </script>
          </body>
          </html>
          EOF
